spring:
  application:
    name: team-memory-mcp

  ai:
    mcp:
      server:
        name: team-memory-mcp
        type: SYNC
        protocol: STREAMABLE

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:team_memory}
    username: ${DB_USER:team_memory}
    password: ${DB_PASSWORD:team_memory}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
